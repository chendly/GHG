function saveSession(d){session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+Number(d.expires_in||3600)};localStorage.setItem(SESSION_KEY,JSON.stringify(session))}
function readSession(){try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{session=null}return session}
async function refreshSession(){if(!session?.refresh_token)throw Error("No session");const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{"Content-Type":"application/json",apikey:PUBLISHABLE_KEY},body:JSON.stringify({refresh_token:session.refresh_token})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||"Session expired");saveSession(d)}
async function token(){if(!session)throw Error("Sign in required");if((session.expires_at||0)-Math.floor(Date.now()/1000)<90)await refreshSession();return session.access_token}
async function api(opts={}){const t=await token();const r=await fetch(`${API}?tenant=${TENANT}`,{...opts,headers:{...(opts.headers||{}),Authorization:`Bearer ${t}`,"Content-Type":"application/json"}});const d=await r.json().catch(()=>({}));if(r.status===401){try{await refreshSession();return api(opts)}catch{logout(false);throw Error("Session expired")}}if(!r.ok)throw Error(d.error||"Request failed");return d}
async function action(action,payload={}){const d=await api({method:"POST",body:JSON.stringify({action,...payload})});await loadAll(false);toast("Saved");return d}
async function api2(opts={}){const tok=await token();const r=await fetch(`${API2}?tenant=${TENANT}`,{...opts,headers:{...(opts.headers||{}),Authorization:`Bearer ${tok}`,"Content-Type":"application/json"}});const d=await r.json().catch(()=>({}));if(r.status===401){try{await refreshSession();return api2(opts)}catch{logout(false);throw Error("Session expired")}}if(!r.ok)throw Error(d.error||"Request failed");return d}
async function action2(action,payload={}){const d=await api2({method:"POST",body:JSON.stringify({action,...payload})});await loadAll(false);toast("Saved");return d}
async function rpc(name,payload={}){const tok=await token();const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{Authorization:`Bearer ${tok}`,apikey:PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(r.status===401){await refreshSession();return rpc(name,payload)}if(!r.ok)throw Error(d.message||d.error||"Payment service unavailable");return d}
function completedPayment(orderId){return (paymentData?.payments||[]).find(p=>p.order_id===orderId&&p.status==="completed")}
function methodLabel(m){return m==="cash"?"Cash":m==="card"?"Swipe / Card":m==="online"?"Online":m==="other"?"Other":"—"}
function methodChip(m){const c=m==="cash"?"method-cash":m==="card"?"method-card":"method-other";return `<span class="method-chip ${c}">${esc(methodLabel(m))}</span>`}

function staffEmailByUserId(id){
  if(!id)return "";
  const s=(D?.staff||[]).find(x=>x.user_id===id||x.auth_user_id===id||x.auth_id===id);
  return s?.email||""
}
function classifyActivity(action="",summary=""){
  const s=`${action} ${summary}`.toLowerCase();
  if(/drawer|till/.test(s))return "till";
  if(/payment|paid|cash|swipe|card/.test(s))return "payment";
  if(/menu|item|price|sold.?out|category|option|archive|inactive/.test(s))return "menu";
  if(/staff|access|role|user|manager|admin|owner|kitchen|front|driver/.test(s))return "staff";
  if(/availability|service|schedule|blocked|zone|delivery/.test(s))return "availability";
  if(/order|cancel|note/.test(s))return "order";
  return "settings"
}
function auditIcon(cat){return ({payment:"💳",till:"💵",menu:"🍝",staff:"👤",availability:"🕒",settings:"⚙️",order:"🧾"})[cat]||"•"}
function unifiedActivity(){
  const events=[];
  (D?.activity||[]).forEach((a,i)=>events.push({
    id:`mgmt-${a.id||i}-${a.created_at}`,
    category:classifyActivity(a.action,a.summary),
    summary:a.summary||a.action||"Management change",
    detail:a.action||"",
    created_at:a.created_at,
    actor:a.actor_email||a.email||""
  }));

  (paymentData?.payments||[]).forEach((p,i)=>{
    const detail=p.method==="cash"
      ? `Cash ${money(p.amount)}${p.amount_tendered!=null?` • Received ${money(p.amount_tendered)} • Change ${money(p.change_given||0)}`:""}`
      : `${methodLabel(p.method)} ${money(p.amount)}${p.reference?` • Ref ${p.reference}`:""}`;
    events.push({
      id:`payment-${p.id||i}`,
      category:"payment",
      summary:`Payment ${p.status==="completed"?"recorded":p.status} • ${p.order_number||"Order"}`,
      detail,
      created_at:p.received_at,
      actor:staffEmailByUserId(p.received_by)
    });
    if(p.status==="void")events.push({
      id:`payment-void-${p.id||i}`,
      category:"payment",
      summary:`Payment voided • ${p.order_number||"Order"}`,
      detail:p.void_reason?`Reason: ${p.void_reason}`:"Payment marked void",
      created_at:p.voided_at||p.received_at,
      actor:staffEmailByUserId(p.voided_by)
    })
  });

  (paymentData?.drawers||[]).forEach((d,i)=>{
    events.push({
      id:`till-open-${d.id||i}`,
      category:"till",
      summary:`Till #${d.session_number||1} opened`,
      detail:`Opening cash ${money(d.opening_cash)}`,
      created_at:d.opened_at,
      actor:staffEmailByUserId(d.opened_by)
    });
    if(d.closed_at||d.status==="closed")events.push({
      id:`till-close-${d.id||i}`,
      category:"till",
      summary:`Till #${d.session_number||1} closed & reconciled`,
      detail:`Expected ${money(d.expected_cash||0)} • Actual ${money(d.actual_cash||0)} • Over/short ${money(d.over_short||0)}${d.close_notes?` • ${d.close_notes}`:""}`,
      created_at:d.closed_at||d.opened_at,
      actor:staffEmailByUserId(d.closed_by)
    })
  });

  (paymentData?.entries||[]).forEach((e,i)=>events.push({
    id:`drawer-entry-${e.id||i}`,
    category:"till",
    summary:`Cash ${e.entry_type==="cash_in"?"added to":"removed from"} till`,
    detail:`${money(e.amount)} • ${e.reason||"No reason entered"}`,
    created_at:e.created_at,
    actor:staffEmailByUserId(e.created_by)
  }));

  return events.filter(e=>e.created_at).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))
}
function auditEventHtml(e){
  return `<div class="audit-event"><div class="audit-icon">${auditIcon(e.category)}</div><div class="audit-main"><b>${esc(e.summary)}</b>${e.detail?`<div class="audit-detail">${esc(e.detail)}</div>`:""}${e.actor?`<div class="audit-detail">By ${esc(e.actor)}</div>`:""}</div><div class="audit-meta"><span>${dt(e.created_at)}</span><span class="audit-tag ${e.category}">${esc(e.category)}</span></div></div>`
}
function setAuditFilter(f){auditFilter=f;renderActivity()}

function money(n){return `${D?.tenant?.currency_symbol||"AWG"} ${Number(n||0).toFixed(2)}`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function localDate(iso=new Date().toISOString()){return new Intl.DateTimeFormat("en-CA",{timeZone:D?.tenant?.timezone||"America/Aruba",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(iso))}
function dt(iso){return new Intl.DateTimeFormat("en-US",{timeZone:D?.tenant?.timezone||"America/Aruba",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(new Date(iso))}
function time(iso){return new Intl.DateTimeFormat("en-US",{timeZone:D?.tenant?.timezone||"America/Aruba",hour:"numeric",minute:"2-digit"}).format(new Date(iso))}
function statusBadge(s){const c={new:"b-new",confirmed:"b-confirmed",preparing:"b-preparing",ready:"b-ready",out_for_delivery:"b-delivery",delivered:"b-done",completed:"b-done",closed:"b-done",cancelled:"b-cancelled"}[s]||"b-done";return `<span class="badge ${c}">${esc(String(s).replaceAll("_"," "))}</span>`}
function payBadge(s,orderId=""){const p=orderId?completedPayment(orderId):null;return s==="paid"?`<span class="badge b-paid">${esc(p?methodLabel(p.method):"paid")}</span>`:`<span class="badge b-unpaid">${esc(s)}</span>`}

function buildNav(){const mk=(id,label)=>`<button data-page="${id}" onclick="showPage('${id}')">${label}</button>`;$("nav").innerHTML=navItems.map(x=>mk(...x)).join("")+`<div class="sep"></div><a class="btn light small" href="/kitchen/" target="_blank">Kitchen ↗</a><a class="btn light small" href="/front/" target="_blank">Front ↗</a><a class="btn light small" href="/driver/" target="_blank">Driver ↗</a>`;$("mobileNav").innerHTML=navItems.map(x=>mk(...x)).join("")}

function setLoginMessage(type,message){
  const err=$("loginError"),ok=$("loginSuccess");
  err.classList.add("hidden");ok.classList.add("hidden");
  if(!message)return;
  const el=type==="ok"?ok:err;el.textContent=message;el.classList.remove("hidden");
}
function setRecoveryMessage(type,message){
  const err=$("recoveryError"),ok=$("recoverySuccess");
  err.classList.add("hidden");ok.classList.add("hidden");
  if(!message)return;
  const el=type==="ok"?ok:err;el.textContent=message;el.classList.remove("hidden");
}
function showRecovery(){
  $("loginForm").classList.add("hidden");
  $("recoveryForm").classList.remove("hidden");
  $("loginTitle").textContent="Choose a new password";
  $("loginIntro").textContent="Your secure recovery link is verified. Enter a new password for your GHG management account.";
  setRecoveryMessage("","");setTimeout(()=>$("newPassword").focus(),50);
}
function showLogin(){
  recoveryToken=null;
  $("recoveryForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
  $("loginTitle").textContent="Restaurant dashboard";
  $("loginIntro").textContent="Sign in with an Owner, Admin or Manager account.";
  $("newPassword").value="";$("confirmPassword").value="";
}
async function requestPasswordReset(){
  const email=$("email").value.trim();
  if(!email){setLoginMessage("error","Enter your email address first.");$("email").focus();return}
  const btn=$("forgotPasswordBtn"),old=btn.textContent;
  btn.disabled=true;btn.textContent="Sending reset link…";setLoginMessage("","");
  try{
    const url=new URL(`${SUPABASE_URL}/auth/v1/recover`);
    if(location.protocol==="http:"||location.protocol==="https:") url.searchParams.set("redirect_to",`${location.origin}/admin/`);
    const r=await fetch(url.toString(),{method:"POST",headers:{"Content-Type":"application/json",apikey:PUBLISHABLE_KEY},body:JSON.stringify({email})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(d.error_description||d.msg||d.message||"Could not send reset email");
    setLoginMessage("ok","If that email belongs to a GHG management account, a secure password reset link has been sent.");
  }catch(e){setLoginMessage("error",e.message)}
  finally{btn.disabled=false;btn.textContent=old}
}
async function saveRecoveredPassword(e){
  e.preventDefault();
  const p=$("newPassword").value,c=$("confirmPassword").value;
  if(!recoveryToken){setRecoveryMessage("error","This recovery link is missing or expired. Request a new password reset email.");return}
  if(p.length<8){setRecoveryMessage("error","Use at least 8 characters for the new password.");return}
  if(p!==c){setRecoveryMessage("error","The two passwords do not match.");return}
  const btn=$("savePasswordBtn"),old=btn.textContent;
  btn.disabled=true;btn.textContent="Saving…";setRecoveryMessage("","");
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:"PUT",headers:{"Content-Type":"application/json",apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${recoveryToken}`},body:JSON.stringify({password:p})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(d.error_description||d.msg||d.message||"Could not update password");
    localStorage.removeItem(SESSION_KEY);session=null;
    history.replaceState(null,"",location.pathname+location.search);
    showLogin();
    setLoginMessage("ok","Password updated successfully. Sign in with your new password.");
    $("password").focus();
  }catch(e){setRecoveryMessage("error",e.message)}
  finally{btn.disabled=false;btn.textContent=old}
}
$("forgotPasswordBtn").addEventListener("click",requestPasswordReset);
$("recoveryForm").addEventListener("submit",saveRecoveredPassword);

$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("loginBtn"),err=$("loginError");err.classList.add("hidden");btn.disabled=true;btn.textContent="Signing in…";try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"Content-Type":"application/json",apikey:PUBLISHABLE_KEY},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||"Invalid login");saveSession(d);await start()}catch(e){localStorage.removeItem(SESSION_KEY);session=null;err.textContent=e.message;err.classList.remove("hidden")}finally{btn.disabled=false;btn.textContent="Sign in"}})

async function logout(callServer=true){if(callServer&&session?.access_token)fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:"POST",headers:{apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${session.access_token}`}}).catch(()=>{});localStorage.removeItem(SESSION_KEY);session=null;$("appView").classList.add("hidden");$("loginView").classList.remove("hidden");$("password").value=""}
async function loadAll(render=true){try{const [main,extras,payments]=await Promise.all([api(),api2(),rpc("get_payment_module_data",{p_tenant_slug:TENANT,p_days:120}).catch(()=>null)]);D=main;D.blocked_dates=extras.blocked_dates||[];paymentData=payments;D.payment_module=payments;document.documentElement.style.setProperty("--p",D.tenant.primary_color||"#24473F");document.documentElement.style.setProperty("--y",D.tenant.accent_color||"#D87750");$("sideName").textContent=D.tenant.name;$("footProjectName").textContent=D.tenant.name;$("topUser").textContent=`${D.staff_user.email} • ${D.staff_user.role}`;document.title=`Management | ${D.tenant.name}`;if(render)renderAll();else renderPage(currentPage);if(currentPage==="loyalty")void loadLoyaltyOverview()}catch(e){toast(e.message);if(String(e.message).includes("access"))logout(false)}}

function renderPage(id){({overview:renderOverview,orders:renderOrders,cash:renderCashDrawer,manual:renderManualOrder,history:renderHistory,menu:renderMenu,availability:renderAvailability,delivery:renderDelivery,staff:renderStaff,reports:renderReports,loyalty:renderLoyalty,settings:renderSettings,activity:renderActivity}[id]||(()=>{}))()}

function orderItems(orderId){return D.order_items.filter(x=>x.order_id===orderId)}
function itemOpts(itemId){return D.order_item_options.filter(x=>x.order_item_id===itemId)}
function orderHistory(orderId){return D.history.filter(x=>x.order_id===orderId).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}
function orderNotes(orderId){return D.notes.filter(x=>x.order_id===orderId).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}
function isToday(o){return o.service_date===localDate()}
function activeOrders(){return D.orders.filter(o=>isToday(o)&&!["completed","closed","cancelled","delivered"].includes(o.status))}
function completedLike(o){return ["completed","closed","cancelled","delivered"].includes(o.status)}
function orderRow(o){return `<tr class="clickrow" onclick="openOrder('${o.id}')"><td><b>${esc(o.order_number)}</b></td><td>${statusBadge(o.status)}</td><td>${esc(o.customer_name)}</td><td>${o.fulfillment}</td><td>${time(o.service_start)}</td><td>${money(o.total)}</td><td>${payBadge(o.payment_status,o.id)}</td></tr>`}

function renderOverview(){
  const today=D.orders.filter(isToday),
        sales=today.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+Number(o.total||0),0),
        avg=today.filter(o=>o.status!=="cancelled").length?sales/today.filter(o=>o.status!=="cancelled").length:0,
        active=activeOrders(),
        prep=active.filter(o=>["confirmed","preparing"].includes(o.status)).length,

        road=active.filter(o=>o.status==="out_for_delivery").length,
        pays=(paymentData?.payments||[]).filter(p=>p.business_date===paymentData?.business_date&&p.status==="completed"),
        cash=pays.filter(p=>p.method==="cash").reduce((s,p)=>s+Number(p.amount||0),0),
        card=pays.filter(p=>p.method==="card").reduce((s,p)=>s+Number(p.amount||0),0),
        drawer=paymentData?.current_drawer,
        expected=drawer?Number(drawer.calculated_expected_cash??drawer.expected_cash??drawer.opening_cash??0):0,

  <div class="stats"><div class="stat"><small>Orders today</small><strong>${today.length}</strong></div><div class="stat"><small>Sales today</small><strong>${money(sales)}</strong></div><div class="stat"><small>Average order</small><strong>${money(avg)}</strong></div><div class="stat"><small>Ready</small><strong>${ready}</strong></div><div class="stat"><small>Cancelled</small><strong>${today.filter(o=>o.status==="cancelled").length}</strong></div></div>

  ${paymentData?.module_enabled?`<div class="overview-payment-panel"><h3>Payments & Till</h3><div class="overview-payment-grid"><div class="overview-payment-stat"><small>Till status</small><strong>${esc(tillStatus)}</strong></div><div class="overview-payment-stat"><small>Cash today</small><strong>${money(cash)}</strong></div><div class="overview-payment-stat"><small>Swipe / Card</small><strong>${money(card)}</strong></div><div class="overview-payment-stat"><small>${drawer?"Expected cash":"Payments today"}</small><strong>${drawer?money(expected):money(cash+card)}</strong></div></div><a class="overview-payment-link" href="#" onclick="showPage('cash');return false">Open Cash Drawer →</a></div>`:""}

  <div class="grid2" style="margin-top:14px"><div class="panel"><div class="panel-head"><h3>Live orders</h3><button class="btn light small" onclick="showPage('orders')">View all</button></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Status</th><th>Customer</th><th>Type</th><th>Time</th><th>Total</th><th>Payment</th></tr></thead><tbody>${active.slice(0,8).map(orderRow).join("")||`<tr><td colspan="7" class="muted">No active orders.</td></tr>`}</tbody></table></div></div><div class="panel"><h3>Operations</h3><div class="live-ops"><a class="op" href="/kitchen/" target="_blank"><span>Kitchen</span><strong>${prep}</strong><span>confirmed / preparing</span></a><a class="op" href="/front/" target="_blank"><span>Front</span><strong>${ready}</strong><span>ready to hand off</span></a><a class="op" href="/driver/" target="_blank"><span>Driver</span><strong>${road}</strong><span>out for delivery</span></a></div><div class="panel-head" style="margin-top:18px"><h3>Recent activity</h3><button class="btn light small" onclick="showPage('activity')">View all</button></div><div class="audit-feed">${recent.map(auditEventHtml).join("")||`<div class="muted tiny">No activity logged yet.</div>`}</div></div></div>`
}
function renderOrders(){$("page-orders").innerHTML=`<div class="page-head"><div><div class="eyebrow">Live operations</div><h2>Orders</h2><p>Open an order to view its items, timeline, notes, payment or cancellation options.</p></div></div><div class="toolbar"><input id="orderSearch" class="search" placeholder="Search order, customer or phone" oninput="filterOrders()"><select id="orderStatusFilter" onchange="filterOrders()"><option value="">All active statuses</option><option>new</option><option>confirmed</option><option>preparing</option><option>ready</option><option value="out_for_delivery">out for delivery</option></select></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Status</th><th>Customer</th><th>Type</th><th>Time</th><th>Total</th><th>Payment</th></tr></thead><tbody id="ordersBody"></tbody></table></div>`;filterOrders()}
function filterOrders(){const q=($("orderSearch")?.value||"").toLowerCase(),s=$("orderStatusFilter")?.value||"";const list=activeOrders().filter(o=>(!s||o.status===s)&&(!q||`${o.order_number} ${o.customer_name} ${o.customer_phone}`.toLowerCase().includes(q)));if($("ordersBody"))$("ordersBody").innerHTML=list.map(orderRow).join("")||`<tr><td colspan="7" class="muted">No matching active orders.</td></tr>`}



function renderCashDrawer(){
  const el=$("page-cash"),p=paymentData;
  if(!p?.module_enabled){el.innerHTML=`<div class="panel"><h3>Payments are not enabled</h3><p class="muted">This restaurant does not currently use the payment/cash drawer module.</p></div>`;return}
  const d=p.current_drawer,pays=(p.payments||[]).filter(x=>x.business_date===p.business_date&&x.status==="completed"),cash=pays.filter(x=>x.method==="cash").reduce((s,x)=>s+Number(x.amount||0),0),card=pays.filter(x=>x.method==="card").reduce((s,x)=>s+Number(x.amount||0),0),other=pays.filter(x=>!["cash","card"].includes(x.method)).reduce((s,x)=>s+Number(x.amount||0),0),total=cash+card+other,expected=d?Number(d.calculated_expected_cash??d.expected_cash??d.opening_cash??0):0;

async function submitManualOrder(){const fulfillment="pickup",timeVal=$("moTime").value,name=$("moName").value.trim(),phone=$("moPhone").value.trim();if(!manualCart.length)return alert("Add at least one item.");if(!name||!phone||!timeVal)return alert("Customer name, phone and an available time are required.");try{const result=await api2({method:"POST",body:JSON.stringify({action:"manual_order",source:$("moSource").value,fulfillment,service_date:localDate(),service_time:timeVal,customer_name:name,customer_phone:phone,delivery_zone_id:null,delivery_address:null,delivery_notes:null,items:manualCart.map(x=>({menu_item_id:x.menu_item_id,quantity:x.quantity,option_ids:x.option_ids}))})});manualCart=[];await loadAll(false);modal("Order created",`<div style="text-align:center;padding:18px"><div style="font-size:36px">✓</div><h2>${esc(result.order.order_number)}</h2><p>This order has entered the same Kitchen workflow as an online order.</p><b>${money(result.order.total)}</b></div>`,`<button class="btn primary" onclick="closeModal();showPage('orders')">View orders</button>`)}catch(e){alert(e.message)}}

const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

<div class="rule-grid">${D.rules.map(r=>`<div class="rule"><div class="rule-head"><div><b>${dayNames[r.day_of_week]}</b><div class="tiny muted">${r.fulfillment}</div></div><label class="tiny"><input id="ra-${r.id}" type="checkbox" ${r.active?"checked":""}> Active</label></div><div class="rule-fields"><div class="field"><label>Order opens</label><input id="ro-${r.id}" type="time" value="${String(r.order_open).slice(0,5)}"></div><div class="field"><label>Order closes</label><input id="rc-${r.id}" type="time" value="${String(r.order_close).slice(0,5)}"></div><div class="field"><label>Service starts</label><input id="rs-${r.id}" type="time" value="${String(r.service_start).slice(0,5)}"></div><div class="field"><label>Service ends</label><input id="re-${r.id}" type="time" value="${String(r.service_end).slice(0,5)}"></div><div class="field"><label>Interval min.</label><input id="ri-${r.id}" type="number" min="5" value="${r.interval_minutes}"></div><div class="field"><label>Capacity</label><input id="rp-${r.id}" type="number" min="1" value="${r.capacity_per_interval}"></div></div><button class="btn primary small" style="margin-top:10px" onclick="saveRule('${r.id}')">Save ${r.fulfillment}</button></div>`).join("")}</div>`}
function openBlockDate(){modal("Block a service date",`<div class="field"><label>Date</label><input id="bdDate" type="date" min="${localDate()}" value="${localDate()}"></div><label style="display:block;margin:10px 0"><input id="bdPickup" type="checkbox" checked> Block pickup</label><label style="display:block;margin:10px 0"><input id="bdDelivery" type="checkbox" checked> Block delivery</label><div class="field"><label>Reason / note</label><input id="bdReason" placeholder="Holiday, private event, maintenance…"></div>`,`<button class="btn primary" onclick="saveBlockedDate()">Block date</button>`)}

async function reopenDate(id){if(!confirm("Reopen ordering for this blocked date?"))return;await action2("blocked_date_delete",{id})}

function durationBetween(o,from,to){const h=orderHistory(o.id),a=h.find(x=>x.status===from),b=h.find(x=>x.status===to);return a&&b?(new Date(b.created_at)-new Date(a.created_at))/60000:null}
function renderReports(){const good=D.orders.filter(o=>o.status!=="cancelled"),last30=good.filter(o=>(Date.now()-new Date(o.created_at))/86400000<=30),sales30=last30.reduce((s,o)=>s+Number(o.total||0),0),cancel=D.orders.filter(o=>o.status==="cancelled");const pay30=(paymentData?.payments||[]).filter(p=>p.status==="completed"&&(Date.now()-new Date(p.received_at))/86400000<=30),cash30=pay30.filter(p=>p.method==="cash").reduce((s,p)=>s+Number(p.amount||0),0),card30=pay30.filter(p=>p.method==="card").reduce((s,p)=>s+Number(p.amount||0),0);const itemCounts={};good.forEach(o=>orderItems(o.id).forEach(i=>itemCounts[i.item_name]=(itemCounts[i.item_name]||0)+Number(i.quantity||0)));const ranked=Object.entries(itemCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);const prep=good.map(o=>durationBetween(o,"preparing","ready")).filter(x=>x!=null&&x>=0),avgPrep=prep.length?prep.reduce((a,b)=>a+b,0)/prep.length:0;const handoff=good.filter(o=>o.fulfillment==="pickup").map(o=>durationBetween(o,"ready","completed")).filter(x=>x!=null&&x>=0),avgHand=handoff.length?handoff.reduce((a,b)=>a+b,0)/handoff.length:0;const delivery=good.filter(o=>o.fulfillment==="delivery").map(o=>durationBetween(o,"out_for_delivery","delivered")).filter(x=>x!=null&&x>=0),avgDelivery=delivery.length?delivery.reduce((a,b)=>a+b,0)/delivery.length:0;const sourceCounts={};D.orders.forEach(o=>sourceCounts[o.source||"web"]=(sourceCounts[o.source||"web"]||0)+1);const cancelRate=D.orders.length?cancel.length/D.orders.length*100:0;$("page-reports").innerHTML=`<div class="page-head"><div><div class="eyebrow">Performance</div><h2>Reports</h2><p>Sales, order sources and operational timing from the live workflow.</p></div><button class="btn light" onclick="exportHistory()">Export order CSV</button></div><div class="report-grid"><div class="report-card"><span class="muted tiny">30-day sales</span><strong>${money(sales30)}</strong></div><div class="report-card"><span class="muted tiny">30-day orders</span><strong>${last30.length}</strong></div><div class="report-card"><span class="muted tiny">30-day cash</span><strong>${money(cash30)}</strong></div><div class="report-card"><span class="muted tiny">30-day swipe</span><strong>${money(card30)}</strong></div><div class="report-card"><span class="muted tiny">Avg kitchen prep</span><strong>${avgPrep?avgPrep.toFixed(1)+" min":"—"}</strong></div><div class="report-card"><span class="muted tiny">Avg delivery time</span><strong>${avgDelivery?avgDelivery.toFixed(1)+" min":"—"}</strong></div><div class="report-card"><span class="muted tiny">Avg ready → pickup</span><strong>${avgHand?avgHand.toFixed(1)+" min":"—"}</strong></div><div class="report-card"><span class="muted tiny">Cancellation rate</span><strong>${cancelRate.toFixed(1)}%</strong></div></div><div class="grid2"><div class="panel"><h3>Order source</h3><div class="rank">${Object.entries(sourceCounts).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<div class="rank-row"><span><span class="source-chip">${esc(n)}</span></span><b>${q}</b></div>`).join("")||`<div class="muted tiny">No orders yet.</div>`}</div><h3 style="margin-top:18px">Best-selling items</h3><div class="rank">${ranked.map(([n,q])=>`<div class="rank-row"><span>${esc(n)}</span><b>${q}</b></div>`).join("")||`<div class="muted tiny">More completed orders are needed for ranking.</div>`}</div></div><div class="panel"><h3>Cancellations</h3><div class="rank">${cancel.slice(0,10).map(o=>`<div class="rank-row clickrow" onclick="openOrder('${o.id}')"><span>${esc(o.order_number)}</span><b>${esc(orderNotes(o.id).find(n=>n.note_type==="cancellation")?.note||"No reason")}</b></div>`).join("")||`<div class="muted tiny">No cancellations recorded.</div>`}</div></div></div>`}

/* Manager-only loyalty overview. An authenticated manager RPC does the
   tenant/role checks server-side. Search is local and never exposes public data. */
function renderLoyalty(){
 const root=$("page-loyalty");
 root.innerHTML=
  '<div class="page-head"><div><div class="eyebrow">Customer relationships</div>'+
  '<h2>Customer Loyalty</h2><p>View verified paid-order points, redemptions, and available balances for GHG customers.</p></div>'+
  '<button id="loyaltyRefresh" class="btn light" type="button" onclick="loadLoyaltyOverview()">↻ Refresh balances</button></div>'+
  '<div class="panel"><div class="loyalty-hint"><strong>Earn:</strong> 1 point for every AWG 1 in eligible paid orders. '+
  '<strong>Redeem:</strong> 10 points for AWG 1 off at the GHG counter with customer consent. '+
  'Points are reserved when a reward is applied and finalized after payment; cancelled or voided rewards release their points. '+
  'Anonymous walk-ins cannot have a personal balance.</div></div>'+
  '<div id="loyaltyStats" class="loyalty-kpis" aria-live="polite"></div>'+
  '<div class="panel">'+
  '<div class="loyalty-toolbar"><div><h3 style="margin:0">Customers & balances</h3>'+
  '<span id="loyaltyCount" class="muted tiny">No results loaded yet.</span></div>'+
  '<input id="loyaltySearch" type="search" maxlength="100" placeholder="Search customer name or phone" oninput="filterLoyalty()" aria-label="Search customers by name or phone"></div>'+
  '<div id="loyaltyStatus" class="muted tiny" aria-live="polite">Open this page to load customer balances.</div>'+
  '<div class="table-wrap"><table class="loyalty-table"><thead><tr>'+
  '<th>Customer</th><th>Phone</th><th>Paid orders</th><th>Paid spend</th>'+
  '<th>Earned</th><th>Used / pending</th><th>Available points</th><th>Redeemable</th><th>Last paid</th>'+
  '</tr></thead><tbody id="loyaltyRows"><tr><td colspan="9" class="muted">Loading customers…</td></tr></tbody></table></div>'+
  '</div>';
 if(loyaltyData)filterLoyalty();
}
async function loadLoyaltyOverview(){
 if(loyaltyLoading||!$("page-loyalty"))return;
 loyaltyLoading=true;
 const btn=$("loyaltyRefresh"),notice=$("loyaltyStatus");
 if(btn)btn.disabled=true;
 if(notice)notice.textContent="Loading verified customer balances…";
 try{
  const result=await rpc("get_customer_loyalty",{p_tenant_slug:TENANT,p_search:null});
  if(!result||result.enabled!==true||!Array.isArray(result.customers))throw Error("No loyalty data returned");
  loyaltyData=result;
  filterLoyalty();
  if(notice)notice.textContent="Balances updated from completed payments. Reward value: "+
   Number(result.points_per_reward)+" points = "+money(result.reward_awg)+".";
 }catch(err){
  loyaltyData=null;
  const tbody=$("loyaltyRows");
  if(tbody)tbody.innerHTML='<tr><td colspan="9" class="muted">Customer balances could not be loaded.</td></tr>';
  if(notice)notice.textContent="Unable to load loyalty balances: "+String(err.message||err);
 }finally{
  loyaltyLoading=false;
  if(btn)btn.disabled=false;
 }
}
function filterLoyalty(){
 if(!loyaltyData)return;
 const all=loyaltyData.customers||[];
 const q=($("loyaltySearch")?.value||"").trim().toLowerCase();
 const rows=all.filter(c=>!q ||
   String(c.name||"").toLowerCase().includes(q)||
   String(c.phone||"").toLowerCase().includes(q));
 const paidProfiles=all.filter(c=>Number(c.paid_orders||0)>0).length;
 const totalAvailable=all.reduce((s,c)=>s+Number(c.available_points||0),0);
 const totalEarned=all.reduce((s,c)=>s+Number(c.earned_points||0),0);
 const redeemableValue=all.reduce((s,c)=>s+Number(c.redeemable_awg||0),0);
 $("loyaltyStats").innerHTML=
  '<div class="loyalty-kpi"><span>Identifiable customers</span><strong>'+all.length+'</strong><small>'+paidProfiles+' with qualifying paid orders</small></div>'+
  '<div class="loyalty-kpi"><span>Points earned</span><strong>'+totalEarned.toLocaleString()+'</strong><small>Lifetime eligible paid orders</small></div>'+
  '<div class="loyalty-kpi"><span>Available points</span><strong>'+totalAvailable.toLocaleString()+'</strong><small>Excludes rewards already used or reserved</small></div>'+
  '<div class="loyalty-kpi"><span>Redeemable value</span><strong>'+money(redeemableValue)+'</strong><small>Whole AWG rewards, by individual customer</small></div>';
 $("loyaltyCount").textContent="Showing "+rows.length+" of "+all.length+" customer profiles";
 const body=$("loyaltyRows");
 if(!rows.length){
  body.innerHTML='<tr><td colspan="9" class="muted">No matching customers found.</td></tr>';
  return;
 }
 body.innerHTML=rows.map(c=>{
  const used=Number(c.redeemed_points||0);
  const reserved=Number(c.reserved_points||0);
  let last="—";
  if(c.last_order_at){const date=new Date(c.last_order_at);if(!isNaN(date))last= date.toLocaleDateString("en-GB",{timeZone:"America/Aruba",day:"2-digit",month:"short",year:"numeric"});}
  return '<tr>'+
   '<td><b>'+esc(c.name||"Unnamed customer")+'</b><small>'+(c.enrolled?"Enrolled in loyalty":"Not yet enrolled")+'</small></td>'+
   '<td>'+esc(c.phone||"—")+'</td>'+
   '<td>'+Number(c.paid_orders||0)+'</td>'+
   '<td>'+money(c.paid_spend_awg)+'</td>'+
   '<td>'+Number(c.earned_points||0).toLocaleString()+'</td>'+
   '<td>'+used.toLocaleString()+' used<small>'+reserved.toLocaleString()+' pending</small></td>'+
   '<td class="l-points">'+Number(c.available_points||0).toLocaleString()+'</td>'+
   '<td class="l-redeem">'+money(c.redeemable_awg)+'</td>'+
   '<td>'+esc(last)+'</td>'+
  '</tr>';
 }).join("");
}

function renderSettings(){const t=D.tenant,l=D.location||{};$("page-settings").innerHTML=`<div class="page-head"><div><div class="eyebrow">Tenant configuration</div><h2>Settings</h2><p>Restaurant identity and operating contact details.</p></div></div><div class="settings-grid"><div class="panel"><h3>Restaurant</h3><div class="field"><label>Restaurant name</label><input id="stName" value="${esc(t.name)}"></div><div class="field"><label>Order prefix</label><input id="stPrefix" value="${esc(t.order_prefix)}"></div><div class="field"><label>Location name</label><input id="stLoc" value="${esc(l.name||"")}"></div><div class="field"><label>Address</label><input id="stAddr" value="${esc(l.address||"")}"></div><div class="field"><label>Phone</label><input id="stPhone" value="${esc(l.phone||"")}"></div></div><div class="panel"><h3>Brand colors</h3><div class="color-row"><div class="field"><label>Primary</label><input id="stP" type="color" value="${t.primary_color||"#24473F"}"></div><div class="field"><label>Secondary</label><input id="stS" type="color" value="${t.secondary_color||"#ffffff"}"></div><div class="field"><label>Accent</label><input id="stA" type="color" value="${t.accent_color||"#D87750"}"></div></div><p class="muted tiny">These colors feed the customer and staff interfaces.</p></div></div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">Save settings</button>`}
async function saveSettings(){await action("settings_save",{name:$("stName").value,order_prefix:$("stPrefix").value,location_name:$("stLoc").value,address:$("stAddr").value,phone:$("stPhone").value,primary_color:$("stP").value,secondary_color:$("stS").value,accent_color:$("stA").value})}

function renderActivity(){

        filtered=auditFilter==="all"?all:all.filter(a=>a.category===auditFilter),
        cats=[["all","All"],["payment","Payments"],["till","Tills"],["menu","Menu"],["staff","Staff"],["availability","Availability"],["order","Orders"],["settings","Settings"]];

}
(async function boot(){if(recoveryToken){$("loginView").classList.remove("hidden");showRecovery();return}if(readSession()){try{await start();return}catch{}}$("loginView").classList.remove("hidden")})();

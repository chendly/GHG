<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24473F">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Kitchen | Gordo Hospitality Group</title>
<style>
:root{
  --p:#24473F;--p2:#315E52;--y:#D87750;--ink:#2D2925;--muted:#726978;
  --bg:#F7F1E8;--card:#fff;--line:#E7DDEB;--red:#B84040;--green:#23764A;
  --orange:#B86917;--blue:#3367A8;--shadow:0 12px 35px rgba(56,24,73,.09)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(255,217,40,.16),transparent 25%),linear-gradient(145deg,#4c126f,#7427a2)}
.login-card{width:min(440px,100%);background:#fff;border-radius:28px;padding:30px;box-shadow:0 30px 90px rgba(20,8,27,.25)}
.logo{width:58px;height:58px;border-radius:18px;background:var(--p);color:var(--y);display:grid;place-items:center;font-weight:950;margin-bottom:22px}
.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:900;color:var(--p)}
.login-card h1{font-size:34px;letter-spacing:-.04em;margin:8px 0 8px}.login-card p{color:var(--muted);line-height:1.55;margin:0 0 22px}
label{display:block;font-weight:850;font-size:13px;margin:15px 0 7px}
input{width:100%;border:1px solid #dcd0e2;border-radius:13px;padding:13px 14px;outline:none}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(91,27,132,.08)}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:900}.btn-primary{background:var(--p);color:#fff}.btn-light{background:#fff;border:1px solid var(--line);color:var(--p)}.btn-yellow{background:var(--y);color:#35163e}.btn-danger{background:#fff0f0;color:var(--red);border:1px solid #efd1d1}
.login-card .btn-primary{width:100%;margin-top:19px;padding:14px}
.error{background:#fff0f0;border:1px solid #efd1d1;color:#943d3d;border-radius:12px;padding:11px 13px;margin-top:14px;font-size:13px}
.app{min-height:100vh}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.header-inner{max-width:1500px;margin:auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}.mini-logo{width:43px;height:43px;border-radius:13px;background:var(--p);color:var(--y);display:grid;place-items:center;font-weight:950}
.brand strong{display:block}.brand small{display:block;color:var(--muted);margin-top:2px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.live{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px;font-weight:900}.live i{width:8px;height:8px;border-radius:50%;background:#2aa45e;box-shadow:0 0 0 4px rgba(42,164,94,.12)}
main{max-width:1500px;margin:auto;padding:22px 20px 50px}
.title-row{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:4px 0 18px}.title-row h1{font-size:34px;letter-spacing:-.04em;margin:4px 0 0}.title-row p{color:var(--muted);margin:0}
.alert{display:none;align-items:center;justify-content:space-between;gap:15px;background:var(--y);padding:12px 15px;border-radius:14px;margin-bottom:14px;font-weight:900;box-shadow:var(--shadow)}
.alert.show{display:flex;animation:pop .25s ease}@keyframes pop{from{transform:translateY(-5px);opacity:.3}to{transform:none;opacity:1}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:17px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.stat small{color:var(--muted);font-weight:800}.stat strong{display:block;font-size:28px;margin-top:3px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:17px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:850}.filter.active{background:var(--p);color:#fff;border-color:var(--p)}
.refresh-text{color:var(--muted);font-size:12px}
.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.order{background:#fff;border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:0 8px 28px rgba(56,24,73,.04);display:flex;flex-direction:column}
.order.new{border:2px solid var(--y)}
.order-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.order-no{font-size:20px;font-weight:950}.meta{color:var(--muted);font-size:13px;margin-top:4px}.time-big{font-size:19px;font-weight:950;text-align:right}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.06em;margin-top:7px}
.badge-new{background:#fff4b6;color:#65520c}.badge-confirmed{background:#eee5f4;color:var(--p)}.badge-preparing{background:#fff0d9;color:#8a4d0f}.badge-ready{background:#dcf5e5;color:#1c6a40}.badge-delivery{background:#e2effd;color:#285f9e}.badge-done{background:#ececec;color:#5b5b5b}
.order-body{padding:17px 18px;flex:1}.customer{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.customer b{display:block}.customer span{color:var(--muted);font-size:12px}.address{background:#f7f3f9;border-radius:12px;padding:10px 11px;margin:0 0 13px;font-size:13px}
.items{border-top:1px dashed #ded3e2}.item{padding:12px 0;border-bottom:1px dashed #ded3e2}.item-title{font-weight:950}.item-title .qtyn{color:var(--p);margin-right:6px}.opts-line{color:#62586a;font-size:13px;line-height:1.45;margin-top:4px}.note{background:#fff6cf;border-radius:11px;padding:9px 10px;margin-top:11px;font-size:12px}
.order-foot{padding:14px 18px;background:#fcfafc;border-top:1px solid var(--line)}.order-foot .btn{width:100%;padding:13px}.secondary-action{margin-top:7px}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #d9cde0;border-radius:20px;padding:55px 20px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:21px;margin-bottom:6px}
.staff-line{font-size:12px;color:var(--muted)}
@media(max-width:1100px){.orders{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.header-inner{align-items:flex-start}.header-actions{justify-content:flex-end}.stats{grid-template-columns:1fr 1fr}.orders{grid-template-columns:1fr}.toolbar,.title-row{align-items:flex-start;flex-direction:column}.time-big{font-size:17px}}
@media(max-width:500px){main{padding:16px 11px 40px}.header-inner{padding:11px}.brand small{display:none}.btn-label{display:none}.stats{gap:7px}.stat{padding:13px}.stat strong{font-size:24px}.orders{gap:11px}}
</style>
</head>
<body>
<section id="loginView" class="login-shell">
  <div class="login-card">
    <div class="logo">GHG</div>
    <div class="eyebrow">Staff access</div>
    <h1>Kitchen login</h1>
    <p>Sign in to view and manage today’s orders for Gordo Hospitality Group.</p>
    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" required placeholder="staff@email.com">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      <button class="btn btn-primary" id="loginBtn" type="submit">Sign in</button>
      <div id="loginError" class="error hidden"></div>
    </form>
  </div>
</section>

<div id="appView" class="app hidden">
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="mini-logo">GHG</div>
      <div><strong id="tenantName">Gordo Hospitality Group</strong><small>Kitchen Screen</small></div>
    </div>
    <div class="header-actions">
      <span class="live"><i></i> AUTO REFRESH</span>
      <button class="btn btn-light" id="soundBtn" onclick="toggleSound()">🔔 <span class="btn-label">Enable sound</span></button>
      <button class="btn btn-light" onclick="loadOrders(true)">↻ <span class="btn-label">Refresh</span></button>
      <button class="btn btn-light" onclick="logout()">Sign out</button>
    </div>
  </div>
</header>

<main>
  <div class="title-row">
    <div><div class="eyebrow">Today’s service</div><h1>Kitchen orders</h1></div>
    <div><p id="todayLabel"></p><div class="staff-line" id="staffLine"></div></div>
  </div>

  <div class="alert" id="newAlert"><span>🔔 New order received</span><span id="newAlertNo"></span></div>

  <div class="stats">
    <div class="stat"><small>New</small><strong id="statNew">0</strong></div>
    <div class="stat"><small>Preparing</small><strong id="statPrep">0</strong></div>
    <div class="stat"><small>Ready</small><strong id="statReady">0</strong></div>
    <div class="stat"><small>Delivery</small><strong id="statDelivery">0</strong></div>
  </div>

  <div class="toolbar">
    <div class="filters">
      <button class="filter active" data-filter="active">Active</button>
      <button class="filter" data-filter="new">New</button>
      <button class="filter" data-filter="preparing">Preparing</button>
      <button class="filter" data-filter="ready">Ready</button>
      <button class="filter" data-filter="done">Done</button>
    </div>
    <div class="refresh-text" id="refreshText">Waiting for orders…</div>
  </div>

  <div class="orders" id="orders"></div>
</main>
</div>

<script>
const SUPABASE_URL = "https://hhgzlvcdoinopqnjlcfi.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_ESxt4gggtkeRxqLB9wgUoQ_9O3Z88TG";
const TENANT = "gordo-hospitality-group";
const API = `${SUPABASE_URL}/functions/v1/kitchen-api`;
const SESSION_KEY = `moonlight-kitchen-${TENANT}`;

let session = null;
let orderData = [];
let tenant = null;
let filter = "active";
let polling = null;
let firstLoad = true;
let knownOrderIds = new Set();
let soundEnabled = false;
let audioCtx = null;

const $ = id => document.getElementById(id);

function saveSession(data){
  session = {
    access_token:data.access_token,
    refresh_token:data.refresh_token,
    expires_at:Math.floor(Date.now()/1000) + Number(data.expires_in || 3600)
  };
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}

function readSession(){
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch { session = null; }
  return session;
}

async function refreshSession(){
  if(!session?.refresh_token) throw new Error("No session");
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
    method:"POST",
    headers:{"Content-Type":"application/json",apikey:PUBLISHABLE_KEY},
    body:JSON.stringify({refresh_token:session.refresh_token})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || "Session expired");
  saveSession(d);
}

async function ensureToken(){
  if(!session) throw new Error("Sign in required");
  if((session.expires_at || 0) - Math.floor(Date.now()/1000) < 90) await refreshSession();
  return session.access_token;
}

async function kitchenFetch(url=API,opts={}){
  const token = await ensureToken();
  const u = new URL(url);
  if(!u.searchParams.has("tenant")) u.searchParams.set("tenant",TENANT);
  u.searchParams.set("screen","kitchen");
  const r = await fetch(u.toString(),{
    ...opts,
    headers:{...(opts.headers||{}),Authorization:`Bearer ${token}`,"Content-Type":"application/json"}
  });
  const d = await r.json().catch(()=>({}));
  if(r.status===401){
    try{ await refreshSession(); return kitchenFetch(url,opts); }
    catch{ await logout(false); throw new Error("Session expired"); }
  }
  if(!r.ok) throw new Error(d.error || "Kitchen request failed");
  return d;
}

$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("loginBtn"),err=$("loginError");
  err.classList.add("hidden");btn.disabled=true;btn.textContent="Signing in…";
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
      method:"POST",
      headers:{"Content-Type":"application/json",apikey:PUBLISHABLE_KEY},
      body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error_description || d.msg || "Invalid email or password");
    saveSession(d);
    await startApp();
  }catch(e){
    localStorage.removeItem(SESSION_KEY);session=null;
    err.textContent=e.message;err.classList.remove("hidden");
  }finally{btn.disabled=false;btn.textContent="Sign in"}
});

async function startApp(){
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  firstLoad=true;knownOrderIds.clear();
  await loadOrders(false);
  if(polling) clearInterval(polling);
  polling=setInterval(()=>loadOrders(false),4000);
}

async function logout(callServer=true){
  if(polling){clearInterval(polling);polling=null}
  if(callServer && session?.access_token){
    fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:"POST",headers:{apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${session.access_token}`}}).catch(()=>{});
  }
  localStorage.removeItem(SESSION_KEY);session=null;
  $("appView").classList.add("hidden");$("loginView").classList.remove("hidden");
  $("password").value="";
}

async function loadOrders(manual=false){
  try{
    if(manual) $("refreshText").textContent="Refreshing…";
    const d=await kitchenFetch();
    tenant=d.tenant;orderData=d.orders||[];
    document.documentElement.style.setProperty("--p",tenant.primary_color||"#24473F");
    document.documentElement.style.setProperty("--y",tenant.accent_color||"#D87750");
    $("tenantName").textContent=tenant.name;
    document.title=`Kitchen | ${tenant.name}`;
    $("todayLabel").textContent=new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric",timeZone:tenant.timezone}).format(new Date());
    $("staffLine").textContent=`${d.staff.email} • ${String(d.staff.role).replaceAll("_"," ")}`;
    detectNewOrders(orderData);
    updateStats();
    renderOrders();
    $("refreshText").textContent=`Updated ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"})}`;
    firstLoad=false;
  }catch(e){
    $("refreshText").textContent=e.message;
    if(e.message.includes("access")||e.message.includes("Sign in")) await logout(false);
  }
}

function detectNewOrders(orders){
  const current=new Set(orders.map(o=>o.id));
  if(!firstLoad){
    const newOnes=orders.filter(o=>!knownOrderIds.has(o.id) && o.status==="new");
    if(newOnes.length){
      $("newAlertNo").textContent=newOnes.map(o=>o.order_number).join(", ");
      $("newAlert").classList.add("show");
      setTimeout(()=>$("newAlert").classList.remove("show"),7000);
      if(soundEnabled) beep();
    }
  }
  knownOrderIds=current;
}

function updateStats(){
  $("statNew").textContent=orderData.filter(o=>o.status==="new").length;
  $("statPrep").textContent=orderData.filter(o=>["confirmed","preparing"].includes(o.status)).length;
  $("statReady").textContent=orderData.filter(o=>o.status==="ready").length;
  $("statDelivery").textContent=orderData.filter(o=>o.fulfillment==="delivery"&&!["completed","delivered"].includes(o.status)).length;
}

document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");filter=b.dataset.filter;renderOrders();
}));

function filteredOrders(){
  if(filter==="new") return orderData.filter(o=>o.status==="new");
  if(filter==="preparing") return orderData.filter(o=>["confirmed","preparing"].includes(o.status));
  if(filter==="ready") return orderData.filter(o=>["ready","out_for_delivery"].includes(o.status));
  if(filter==="done") return orderData.filter(o=>["delivered","completed"].includes(o.status));
  return orderData.filter(o=>!["delivered","completed"].includes(o.status));
}

function formatTime(iso){
  return new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",timeZone:tenant?.timezone||"America/Aruba"}).format(new Date(iso));
}
function age(iso){
  const m=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000));
  if(m<1)return"just now";if(m<60)return`${m} min ago`;const h=Math.floor(m/60);return`${h}h ${m%60}m ago`;
}
function statusLabel(s){
  return {new:"New",confirmed:"Confirmed",preparing:"Preparing",ready:"Ready",out_for_delivery:"Out for delivery",delivered:"Delivered",completed:"Completed"}[s]||s;
}
function badgeClass(s){
  if(s==="new")return"badge-new";if(s==="confirmed")return"badge-confirmed";if(s==="preparing")return"badge-preparing";
  if(s==="ready")return"badge-ready";if(s==="out_for_delivery")return"badge-delivery";return"badge-done";
}
function nextAction(o){
  if(o.status==="new")return["Confirm order","confirmed"];
  if(o.status==="confirmed")return["Start preparing","preparing"];
  if(o.status==="preparing")return["Mark ready","ready"];
  return null;
}

function renderOrders(){
  const list=filteredOrders();
  $("orders").innerHTML=list.length?list.map(o=>{
    const action=nextAction(o);
    const itemHtml=(o.items||[]).map(i=>{
      const opts=(i.options||[]).map(x=>x.option_name).join(" • ");
      return `<div class="item"><div class="item-title"><span class="qtyn">${i.quantity}×</span>${escapeHtml(i.item_name)}</div>${opts?`<div class="opts-line">${escapeHtml(opts)}</div>`:""}${i.notes?`<div class="note">${escapeHtml(i.notes)}</div>`:""}</div>`;
    }).join("");
    return `<article class="order ${o.status==="new"?"new":""}">
      <div class="order-head">
        <div><div class="order-no">${escapeHtml(o.order_number)}</div><div class="meta">${o.fulfillment==="delivery"?"Delivery":"Pickup"} • ordered ${age(o.created_at)}</div><span class="badge ${badgeClass(o.status)}">${statusLabel(o.status)}</span></div>
        <div class="time-big">${formatTime(o.service_start)}</div>
      </div>
      <div class="order-body">
        <div class="customer"><div><b>${escapeHtml(o.customer_name)}</b><span>${escapeHtml(o.customer_phone)}</span></div><b>${o.fulfillment==="delivery"?"DELIVERY":"PICKUP"}</b></div>
        ${o.fulfillment==="delivery"&&o.delivery_address?`<div class="address"><b>Deliver to:</b><br>${escapeHtml(o.delivery_address)}</div>`:""}
        <div class="items">${itemHtml}</div>
        ${o.delivery_notes?`<div class="note"><b>Delivery note:</b> ${escapeHtml(o.delivery_notes)}</div>`:""}
      </div>
      <div class="order-foot">
        ${action?`<button class="btn ${o.status==="new"?"btn-yellow":"btn-primary"}" onclick="setStatus('${o.id}','${action[1]}',this)">${action[0]}</button>`:`<button class="btn btn-light" disabled>${o.status==="ready"?"Ready — Front of House takes over":"Kitchen complete"}</button>`}
      </div>
    </article>`;
  }).join(""):`<div class="empty"><strong>No orders here right now.</strong>New orders will appear automatically.</div>`;
}

async function setStatus(id,status,btn){
  const original=btn.textContent;btn.disabled=true;btn.textContent="Updating…";
  try{
    await kitchenFetch(API,{method:"POST",body:JSON.stringify({action:"status",order_id:id,status})});
    await loadOrders(false);
  }catch(e){alert(e.message);btn.disabled=false;btn.textContent=original}
}

function toggleSound(){
  soundEnabled=!soundEnabled;
  if(soundEnabled){
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    beep();
  }
  $("soundBtn").innerHTML=soundEnabled?'🔔 <span class="btn-label">Sound on</span>':'🔕 <span class="btn-label">Enable sound</span>';
}
function beep(){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=.08;o.start();
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.35);o.stop(audioCtx.currentTime+.36);
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

(async function boot(){
  if(readSession()){
    try{await startApp();return}catch{}
  }
  $("loginView").classList.remove("hidden");
})();
</script>
</body>
</html>
